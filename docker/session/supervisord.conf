[supervisord]
nodaemon=true
user=rbuser

[program:xvfb]
command=/bin/sh -c 'Xvfb :1 -screen 0 ${RB_SCREEN_WIDTH:-1280}x${RB_SCREEN_HEIGHT:-752}x${RB_SCREEN_DEPTH:-24}'
autorestart=true

[program:fluxbox]
command=fluxbox
autorestart=true
environment=DISPLAY=:1

[program:vnc]
command=/bin/sh -c 'vncserver :1 -geometry ${RB_SCREEN_WIDTH:-1280}x${RB_SCREEN_HEIGHT:-752} -depth ${RB_SCREEN_DEPTH:-24} -localhost yes -SecurityTypes None'
autorestart=true

[program:novnc]
command=websockify --web /usr/share/novnc --cert none --key none 6080 localhost:5901
autorestart=true

[program:file-service]
command=/usr/local/bin/file-service
autorestart=true

[program:webrtc-service]
command=/usr/local/bin/webrtc-service
autorestart=true
environment=DISPLAY=:1,RB_WEBRTC_PORT=6082,RB_WEBRTC_UDP_PORT=6083,RB_WEBRTC_ICE_IP=127.0.0.1,RB_AUDIO_SOURCE=rb_audio.monitor

[program:input-service]
command=/usr/local/bin/input-service
autorestart=true
environment=DISPLAY=:1,RB_INPUT_PORT=6084

[program:chromium]
command=/bin/sh -c 'SCREEN_WIDTH="${RB_SCREEN_WIDTH:-1280}"; SCREEN_HEIGHT="${RB_SCREEN_HEIGHT:-752}"; CHROME_WINDOW_TOP="${RB_CHROME_WINDOW_TOP:-32}"; CHROME_WINDOW_BOTTOM="${RB_CHROME_WINDOW_BOTTOM:-0}"; CHROME_WINDOW_HEIGHT=$((SCREEN_HEIGHT - CHROME_WINDOW_TOP - CHROME_WINDOW_BOTTOM)); if [ "$CHROME_WINDOW_HEIGHT" -lt 480 ]; then CHROME_WINDOW_HEIGHT="$SCREEN_HEIGHT"; CHROME_WINDOW_TOP=0; fi; exec chromium --user-data-dir=/home/rbuser/profile --window-position=0,"$CHROME_WINDOW_TOP" --window-size="$SCREEN_WIDTH,$CHROME_WINDOW_HEIGHT" --no-sandbox --test-type --disable-dev-shm-usage --disable-background-networking --disable-sync --disable-component-update --disable-features=OptimizationGuideModelDownloading,OptimizationHints,MediaRouter,Translate --disable-session-crashed-bubble --hide-crash-restore-bubble --load-extension=/opt/remotebrowser/download-extension --no-first-run --no-default-browser-check --display=:1'
autorestart=true
