{{define "content"}}
<main class="dashboard-main narrow"><p class="eyebrow">ACCOUNT SECURITY</p><h1>修改密码</h1>
    <p class="muted">{{if .User.MustChangePassword}}这是临时密码。先设置自己的密码，再开始使用浏览器实例。{{else}}修改后需要重新登录，浏览器实例继续保留运行。{{end}}</p>
    <form class="panel form-panel" method="post" action="/api/account/password"><input type="hidden" name="csrf_token" value="{{.CSRF}}">
        <div class="form-group"><label for="current-password">当前密码</label><input id="current-password" name="current_password" type="password" autocomplete="current-password" required></div>
        <div class="form-group"><label for="new-password">新密码</label><input id="new-password" name="new_password" type="password" minlength="12" autocomplete="new-password" required><small class="muted">至少 12 个字符。</small></div>
        <div class="form-group"><label for="confirm-password">确认新密码</label><input id="confirm-password" name="confirm_password" type="password" minlength="12" autocomplete="new-password" required></div><button class="btn btn-primary">保存新密码</button>
    </form>
</main>
{{end}}
