<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}} - RemoteBrowser</title>
    <meta name="csrf-token" content="{{.CSRF}}">
    <link rel="stylesheet" href="/static/css/app.css?v=persistent-v3-dialog">
    <script src="/static/js/app.js?v=persistent-v3-dialog" defer></script>
    <script src="/static/vendor/htmx.min.js" defer></script>
    <script src="/static/vendor/alpine.min.js" defer></script>
</head>
<body class="dark">
    {{if and .User (not .Bare)}}
    <nav class="navbar" aria-label="主导航">
        <a class="navbar-brand" href="/"><span class="brand-mark">RB</span><span>RemoteBrowser</span></a>
        <div class="nav-links"><a href="/">浏览器实例</a>{{if eq .User.Role "admin"}}<a href="/admin/users">用户管理</a><a href="/admin/resources">资源概览</a>{{end}}</div>
        <div class="navbar-actions"><span class="user-name">{{.User.Username}}</span><a class="btn btn-ghost btn-sm" href="/account/password">修改密码</a><form method="post" action="/api/logout"><input type="hidden" name="csrf_token" value="{{.CSRF}}"><button class="btn btn-ghost btn-sm">退出</button></form></div>
    </nav>
    {{end}}
    {{if .Notice}}<div class="notice" role="status">{{.Notice}}</div>{{end}}
    <div id="request-error" class="notice notice-error" role="alert" hidden></div>
    {{template "content" .}}
    <dialog id="action-confirm" class="action-confirm" aria-labelledby="action-confirm-title" aria-describedby="action-confirm-message">
        <p class="eyebrow">请核对操作影响</p>
        <h2 id="action-confirm-title">确认操作</h2>
        <p id="action-confirm-message"></p>
        <div class="action-confirm-buttons">
            <button id="action-confirm-cancel" type="button" class="btn btn-ghost" autofocus>取消</button>
            <button id="action-confirm-accept" type="button" class="btn btn-danger">确认执行</button>
        </div>
    </dialog>
</body>
</html>
